# console.toml for claude-quota
# Lives at the repo root. The console reads this file from the repo at every
# build, and it is validated before anything touches Docker.

# Secrets the daemon needs at runtime, listed by NAME only. The values live in
# the console (project page -> secrets), never in git. This line must stay
# ABOVE the first [section] header.
# CEDAR_API_KEY is optional: with it the weekly budget reads Lumasoft shifts
# from Cedar to decide which days are work days.
secrets = ["CLAUDE_QUOTA_TOKEN", "CEDAR_API_KEY"]

[app]
name = "claude-quota"
subdomain = "claude-quota"
port = 7788

[health]
path = "/api/health"
timeout = 60

[resources]
memory = "512m"
cpus = 1.0

# SQLite at /data/quota.db (CLAUDE_QUOTA_DIR=/data in the image), on the NAS
# root: the tank disk attached to the mini, mounted into Colima over virtiofs,
# not SMB. Replaced Neon on 2026-11-05 after the Neon project hit its quota.
[[volumes]]
name = "data"
target = "/data"
storage = "nas"

# Required with [[volumes]]: swap would run two daemons on one SQLite file.
[deploy]
strategy = "recreate"

[env]
CLAUDE_QUOTA_HOST = "0.0.0.0"
CLAUDE_QUOTA_DISABLE_OTLP = "1"
