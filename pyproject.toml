[project]
name = "claude-quota"
version = "0.1.0"
description = "A local quota dashboard for parallel Claude Code sessions: true 5h/7d utilization, per-session attribution, and time-to-exhaustion projection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sam Stuhl" }]
keywords = ["claude-code", "quota", "dashboard", "opentelemetry", "observability"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "grpcio>=1.62",
    "opentelemetry-proto>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
claude-quota = "claude_quota.cli.main:app"
ccq = "claude_quota.cli.main:app"
claude-quotad = "claude_quota.daemon.runner:main"

[project.urls]
Homepage = "https://github.com/Sam-Stuhl/claude-quota"
Repository = "https://github.com/Sam-Stuhl/claude-quota"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_quota"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
